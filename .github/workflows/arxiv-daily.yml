name: arXiv robotics paper collector

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-paper-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error title=Missing repository secret::OPENAI_API_KEY is not configured. Add it at Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [[ -z "${OPENAI_MODEL:-}" ]]; then
            echo "::error title=Missing repository variable::OPENAI_MODEL is not configured. Add it at Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "OpenAI configuration found (model: ${OPENAI_MODEL})."

      - name: Fetch and analyze papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m paperclaw fetch --root .

      - name: Commit new papers
        shell: bash
        run: |
          for path in Quard-robot humanoid pick .paperclaw/state.json; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "paper-claw[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: collect daily arXiv robotics papers"
          git push origin HEAD:main
