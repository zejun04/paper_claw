name: arXiv robotics paper collector

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-paper-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_MODEL"

      - name: Fetch and analyze papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m paperclaw fetch --root .

      - name: Commit new papers
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "paper-claw[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Quard-robot humanoid pick .paperclaw/state.json
          git commit -m "chore: collect daily arXiv robotics papers"
          git push origin HEAD:main
